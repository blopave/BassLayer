<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BassLayer — Preview mobile + desktop</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --bg:#0A0A0A; --panel:#131317; --ink:#E5E5E5; --soft:#777; --hair:#26262e; --acc:#24e2e8;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--mono); overflow:hidden; }

  .bar {
    display:flex; align-items:center; gap:.6rem; height:52px; padding:0 1rem;
    border-bottom:1px solid var(--hair); background:var(--panel);
  }
  .bar .title { font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--soft); margin-right:.4rem; }
  .bar .title b { color:#C49070; font-weight:600; }
  .bar button {
    appearance:none; font:inherit; font-size:.68rem; letter-spacing:.06em; cursor:pointer;
    color:var(--soft); background:transparent; border:1px solid var(--hair); border-radius:999px;
    padding:.42rem .85rem; transition:color .2s, border-color .2s, background .2s;
  }
  .bar button:hover { color:var(--ink); border-color:var(--soft); }
  .bar button.on { color:#06131a; background:var(--acc); border-color:var(--acc); }
  .bar .reload { margin-left:auto; }
  .bar .hint { color:var(--soft); font-size:.6rem; letter-spacing:.08em; opacity:.7; }

  /* Escenario: ambas columnas centradas, ambos marcos COMPLETOS dentro de la ventana */
  .stage { display:flex; gap:1.4rem; height:calc(100% - 52px); padding:1.4rem; align-items:center; justify-content:center; }
  .col { display:flex; flex-direction:column; align-items:center; gap:.7rem; height:100%; justify-content:center; }
  .col .cap { font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; color:var(--soft); flex:0 0 auto; }
  .col .cap em { font-style:normal; color:#999; }
  .screen {
    position:relative; overflow:hidden; background:#000; border:1px solid var(--hair);
    box-shadow:0 30px 80px rgba(0,0,0,.5); flex:0 0 auto;
  }
  /* el iframe se renderiza a su tamaño real y lo escalamos para que entre entero en el panel */
  .screen iframe { position:absolute; top:0; left:0; border:0; transform-origin:top left; background:#000; }
  .col--mobile .screen { border-radius:26px; }
  .col--desktop .screen { border-radius:8px; }
</style>
</head>
<body>
  <div class="bar">
    <span class="title"><b>BassLayer</b> · mobile + desktop</span>
    <button type="button" data-href="/">Home</button>
    <button type="button" data-href="/?view=layer">Layer</button>
    <button type="button" data-href="/eventos/hoy">Agenda</button>
    <button type="button" class="reload" data-reload>↻ recargar</button>
    <span class="hint">HMR de Vite refresca solo</span>
  </div>

  <div class="stage">
    <div class="col col--mobile">
      <span class="cap">mobile · <em>390 × 844</em></span>
      <div class="screen" data-screen="mobile"><iframe data-frame="mobile" title="BassLayer mobile"></iframe></div>
    </div>
    <div class="col col--desktop">
      <span class="cap">desktop · <em>1440</em></span>
      <div class="screen" data-screen="desktop"><iframe data-frame="desktop" title="BassLayer desktop"></iframe></div>
    </div>
  </div>

  <script>
    // Herramienta de trabajo (solo dev): el sitio en MOBILE y DESKTOP lado a lado,
    // en vivo, en UNA sola ventana, con AMBOS marcos completos (escalados para
    // entrar enteros midiendo el espacio real). Técnica portada del /ver de blopa.
    const ORIGIN = location.origin; // vite sirve preview.html en :3000
    const MW = 390, MH = 844, DW = 1440, DH = 900;
    let current = new URLSearchParams(location.search).get('u') || '/?view=layer';

    const mFrame = document.querySelector('[data-frame="mobile"]');
    const dFrame = document.querySelector('[data-frame="desktop"]');
    const mScreen = document.querySelector('[data-screen="mobile"]');
    const dScreen = document.querySelector('[data-screen="desktop"]');
    const btns = Array.from(document.querySelectorAll('.bar button[data-href]'));

    // tamaño real del iframe; el .screen se escala para contenerlo
    mFrame.style.width = MW + 'px'; mFrame.style.height = MH + 'px';
    dFrame.style.width = DW + 'px'; dFrame.style.height = DH + 'px';

    function fit() {
      const stage = document.querySelector('.stage');
      const sc = getComputedStyle(stage);
      const availW = stage.clientWidth - parseFloat(sc.paddingLeft) - parseFloat(sc.paddingRight);
      const availH = stage.clientHeight - parseFloat(sc.paddingTop) - parseFloat(sc.paddingBottom);
      const gap = parseFloat(sc.columnGap) || 0;
      // alto disponible para el marco: la columna menos su etiqueta y el gap
      const frameH = (screen) => {
        const col = screen.parentElement;
        const cap = col.querySelector('.cap').getBoundingClientRect().height;
        return availH - cap - (parseFloat(getComputedStyle(col).rowGap) || 0);
      };
      // mobile primero: lo manda el alto (y en ventanas angostas, un tope de ancho)
      const mScale = Math.max(0.05, Math.min(1, frameH(mScreen) / MH, (availW * 0.32) / MW));
      mFrame.style.transform = `scale(${mScale})`;
      mScreen.style.width = MW * mScale + 'px';
      mScreen.style.height = MH * mScale + 'px';
      // desktop: usa el ancho restante y el alto disponible, lo que limite primero
      const dAvailW = availW - MW * mScale - gap;
      const dScale = Math.max(0.05, Math.min(dAvailW / DW, frameH(dScreen) / DH));
      dFrame.style.transform = `scale(${dScale})`;
      dScreen.style.width = DW * dScale + 'px';
      dScreen.style.height = DH * dScale + 'px';
    }

    function load(href) {
      current = href;
      const url = ORIGIN + href;
      mFrame.src = url; dFrame.src = url;
      btns.forEach((b) => b.classList.toggle('on', b.dataset.href === href));
      const u = new URL(location.href); u.searchParams.set('u', href); history.replaceState({}, '', u);
    }

    btns.forEach((b) => b.addEventListener('click', () => load(b.dataset.href)));
    document.querySelector('[data-reload]').addEventListener('click', () => { const u = ORIGIN + current; mFrame.src = u; dFrame.src = u; });
    addEventListener('resize', fit);
    new ResizeObserver(fit).observe(document.documentElement);
    load(current); fit();
  </script>
</body>
</html>
