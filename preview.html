<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BassLayer — Preview desktop + mobile</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0A0A0A; color:#E5E5E5; min-height:100vh;
    font-family:ui-monospace, 'SF Mono', Menlo, monospace;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header {
    display:flex; align-items:baseline; gap:14px;
    padding:10px 18px; border-bottom:1px solid #222; flex-shrink:0;
  }
  header b { font-size:13px; letter-spacing:-0.02em; color:#C49070; }
  header span { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#666; }
  header .hint { margin-left:auto; }
  main { flex:1; display:flex; gap:18px; padding:18px; min-height:0; }
  .pane { display:flex; flex-direction:column; gap:8px; min-width:0; }
  .pane-label { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#666; flex-shrink:0; }
  .pane-label em { font-style:normal; color:#999; }
  /* Desktop: iframe a 1440 real, escalado para caber en su panel */
  .desktop { flex:1; min-width:0; }
  .desktop .frame-clip { flex:1; overflow:hidden; border:1px solid #2A2A2A; border-radius:10px; position:relative; }
  .desktop iframe {
    width:1440px; height:2000px; border:0;
    transform-origin:0 0; position:absolute; top:0; left:0;
  }
  /* Mobile: tamaño real de un 390×844, scrolleable adentro */
  .mobile { flex:0 0 390px; }
  .mobile .frame-clip {
    flex:1; max-height:100%; overflow:hidden;
    border:1px solid #2A2A2A; border-radius:22px;
  }
  .mobile iframe { width:390px; height:100%; border:0; display:block; }
</style>
</head>
<body>
  <header>
    <b>BassLayer</b><span>preview en vivo</span>
    <span class="hint">HMR de Vite: los cambios de código refrescan solos</span>
  </header>
  <main>
    <div class="pane desktop">
      <div class="pane-label">Desktop <em>1440 escalado</em></div>
      <div class="frame-clip"><iframe id="fd" src="http://localhost:3000/" title="BassLayer desktop"></iframe></div>
    </div>
    <div class="pane mobile">
      <div class="pane-label">Mobile <em>390 × real</em></div>
      <div class="frame-clip"><iframe src="http://localhost:3000/" title="BassLayer mobile"></iframe></div>
    </div>
  </main>
  <script>
    // Escala el iframe desktop para que 1440px quepan en el ancho disponible.
    const fd = document.getElementById('fd');
    const clip = fd.parentElement;
    function fit() {
      const s = clip.clientWidth / 1440;
      fd.style.transform = `scale(${s})`;
      fd.style.height = (clip.clientHeight / s) + 'px';
    }
    new ResizeObserver(fit).observe(clip);
    fit();
  </script>
</body>
</html>
