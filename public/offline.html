<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>BassLayer · sin conexión</title>
<style>
  @font-face { font-family: Geist; src: url(/fonts/geist-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url(/fonts/geist-mono-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  html, body { height: 100%; margin: 0; }
  body { background: #000; color: #EDEAE4; font: 15px/1.5 Geist, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); box-sizing: border-box; }
  main { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; max-width: 320px; }
  img { width: 112px; height: 112px; border-radius: 22.37%; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin: 6px 0 0; }
  p { margin: 0; color: #8A8780; }
  button { margin-top: 6px; background: none; border: 0; border-bottom: 1px solid #EDEAE4; color: #EDEAE4; padding: 4px 0; font: 500 12px "Geist Mono", monospace; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icon-512.png" alt="">
  <h1 data-es="Sin conexión" data-en="You're offline">Sin conexión</h1>
  <p data-es="BassLayer vuelve apenas haya señal." data-en="BassLayer will be back as soon as you're online.">BassLayer vuelve apenas haya señal.</p>
  <button onclick="location.reload()" data-es="Reintentar" data-en="Retry">Reintentar</button>
</main>
<script>
  // mismo idioma que el sitio (si la persona lo eligió) o el del teléfono
  var l = "es"; try { l = localStorage.getItem("bl-locale") || (navigator.language || "es").slice(0, 2); } catch (e) {}
  if (l === "en") { document.documentElement.lang = "en"; document.querySelectorAll("[data-en]").forEach(function (n) { n.textContent = n.dataset.en; }); }
  addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
